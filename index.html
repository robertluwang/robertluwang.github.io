<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robert Wang</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 600px;
      padding: 3rem 2rem;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .tagline {
      color: #888;
      font-size: 1.1rem;
      margin-bottom: 2.5rem;
    }
    .sites {
      list-style: none;
      margin-bottom: 2.5rem;
    }
    .sites li {
      margin: 0.8rem 0;
    }
    .sites a {
      color: #0096D6;
      text-decoration: none;
      font-size: 1.1rem;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .sites a:hover {
      background: rgba(0, 150, 214, 0.1);
      text-decoration: underline;
    }
    .sites .desc {
      color: #666;
      font-size: 0.85rem;
      margin-top: 0.2rem;
    }
    .socials {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }
    .socials a {
      color: #666;
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    .socials a:hover { color: #0096D6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Robert Wang</h1>
    <p class="tagline">Tech notes, tools, and open-source projects</p>

    <ul class="sites">
      <li>
        <a href="https://robertluwang.github.io/artark-ai/">Artark AI</a>
        <div class="desc">AI tech blog — Hugo, agents, automation</div>
      </li>
      <li>
        <a href="https://github.com/robertluwang/hugo-blog-pipeline">Hugo Blog Pipeline</a>
        <div class="desc">Open-source blogging tooling — scaffolding, CI validation, banner fitting</div>
      </li>
    </ul>

    <div class="socials">
      <a href="https://github.com/robertluwang">GitHub</a>
      <a href="https://x.com/robertluwang">X</a>
    </div>
  </div>
</body>
</html>
